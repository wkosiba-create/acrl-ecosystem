<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innovation Ecosystem Mapping — L2M</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#fff;color:#1a1a1a;font-size:14px}
.nav{display:flex;border-bottom:1px solid #e5e5e5;background:#f9f9f9;position:sticky;top:0;z-index:50}
.nav-btn{padding:12px 20px;font-size:13px;font-weight:500;border:none;background:transparent;color:#666;cursor:pointer;border-bottom:2px solid transparent}
.nav-btn.active{color:#1a1a1a;border-bottom-color:#534AB7}
.nav-btn:hover:not(.active){background:#f0f0f0}
.view{padding:1.5rem;max-width:740px;margin:0 auto}
.section-header{font-size:11px;font-weight:600;color:#534AB7;text-transform:uppercase;letter-spacing:0.07em;margin:1.75rem 0 1rem;padding-bottom:6px;border-bottom:1px solid #e5e5e5}
.section-header:first-child{margin-top:0}
.field{margin-bottom:1.1rem}
.label{display:block;font-size:13px;font-weight:500;color:#1a1a1a;margin-bottom:5px}
.req{color:#D85A30}
input[type=text],input[type=number],select,textarea{width:100%;padding:8px 11px;font-size:13px;border:1px solid #d0d0d0;border-radius:8px;background:#fff;color:#1a1a1a;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:#7F77DD;box-shadow:0 0 0 3px rgba(127,119,221,0.12)}
textarea{resize:vertical;min-height:80px;line-height:1.5}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.check-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border:1px solid #e5e5e5;border-radius:7px;cursor:pointer;background:#f9f9f9;user-select:none}
.check-item:hover{background:#f0f0f0}
.check-item input[type=checkbox],.check-item input[type=radio]{width:14px;height:14px;margin-top:1px;flex-shrink:0;accent-color:#534AB7;pointer-events:none}
.check-item label{font-size:12px;color:#1a1a1a;cursor:pointer;line-height:1.4;pointer-events:none}
.check-item.sel{background:#EEEDFE;border-color:#AFA9EC}
.radio-group{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.submit-btn{width:100%;padding:11px;font-size:14px;font-weight:500;background:#534AB7;color:white;border:none;border-radius:8px;cursor:pointer;margin-top:1rem}
.submit-btn:hover{background:#3C3489}
.submit-btn:disabled{background:#ccc;color:#888;cursor:not-allowed}
.trl-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.acrl-section{border:1px solid #e5e5e5;border-radius:8px;margin-bottom:8px;overflow:hidden}
.acrl-dim-header{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#f9f9f9;cursor:pointer;user-select:none}
.acrl-dim-header:hover{background:#f0f0f0}
.acrl-dim-header input[type=checkbox]{accent-color:#534AB7;width:14px;height:14px;flex-shrink:0;pointer-events:none}
.acrl-dim-label{font-size:13px;font-weight:500;flex:1}
.acrl-dim-color{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.acrl-dim-body{padding:12px;display:none;border-top:1px solid #e5e5e5;background:#fff}
.acrl-dim-body.open{display:block}
.acrl-entry-exit{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvl-label{font-size:11px;color:#666;margin-bottom:4px;font-weight:500}
.trl-def{font-size:11px;color:#555;margin-top:4px;line-height:1.4;padding:5px 8px;background:#f5f5f5;border-radius:5px;display:none}
.trl-def.show{display:block}
.err{color:#D85A30;font-size:12px;margin-top:6px}
.disclaimer{font-size:12px;color:#555;background:#F0F4FF;border:1px solid #D0D8F0;border-radius:8px;padding:10px 14px;line-height:1.6;margin-bottom:1.1rem}
.disclaimer.warn{background:#FFF8ED;border-color:#F0D8A0;color:#7A5500}
.disclaimer.neutral{background:#F5F5F5;border-color:#E0E0E0;color:#444}
.frl-supports{background:#FFF8ED;border:1px solid #F0D8A0;border-radius:8px;padding:12px;margin-top:10px;display:none}
.frl-supports.open{display:block}
.frl-supports-label{font-size:12px;font-weight:500;color:#7A5500;margin-bottom:8px}
.frl-supports select{font-size:12px}
.success-box{text-align:center;padding:2.5rem 1rem}
.success-icon{font-size:48px;color:#1D9E75;margin-bottom:1rem}
.success-actions{display:flex;gap:10px;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
.action-btn{padding:10px 22px;font-size:13px;font-weight:500;border:none;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.action-btn.primary{background:#534AB7;color:white}
.action-btn.secondary{background:#f0f0f0;color:#1a1a1a;border:1px solid #d0d0d0}
.action-btn:hover:not(:disabled){opacity:0.85}
.action-btn:disabled{opacity:0.5;cursor:not-allowed}
.gen-status{display:none;align-items:center;gap:8px;color:#666;font-size:12px;padding:8px 0;justify-content:center;margin-top:0.75rem}
.gen-status.show{display:flex}
.spin{width:14px;height:14px;border:2px solid #e5e5e5;border-top-color:#534AB7;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
/* Map */
.map-container{padding:1.25rem;max-width:100%}
.map-toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem;flex-wrap:wrap;gap:8px}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.stat-card{background:#f5f5f5;border-radius:8px;padding:10px 12px}
.stat-label{font-size:11px;color:#666;margin-bottom:3px}
.stat-val{font-size:22px;font-weight:500;color:#1a1a1a}
.filter-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap;padding:10px 12px;background:#f9f9f9;border:1px solid #e5e5e5;border-radius:8px}
.filter-label{font-size:11px;font-weight:600;color:#555;white-space:nowrap}
.pill-btn{padding:4px 10px;font-size:11px;font-weight:500;border:1px solid #d0d0d0;border-radius:20px;background:#fff;color:#555;cursor:pointer;white-space:nowrap}
.pill-btn:hover{background:#f0f0f0}
.pill-btn.active{background:#534AB7;color:white;border-color:#534AB7}
.pill-btn.funding-active{background:#FAC775;color:#7A5500;border-color:#F0A800}
.filter-divider{width:1px;height:16px;background:#e5e5e5;flex-shrink:0}
.filter-count{font-size:11px;color:#888;margin-left:auto;white-space:nowrap}
/* Funding view mode bar */
.view-mode-bar{display:flex;align-items:center;gap:10px;margin-bottom:1rem;padding:10px 14px;border-radius:8px;border:1px solid #e5e5e5;background:#f9f9f9}
.view-mode-bar.funding-mode{background:#FFF8ED;border-color:#F0D8A0}
.view-mode-label{font-size:12px;font-weight:500;color:#555;flex:1}
.view-mode-bar.funding-mode .view-mode-label{color:#7A5500}
.view-mode-legend{display:flex;align-items:center;gap:12px;font-size:11px;color:#888}
.legend-swatch{width:14px;height:14px;border-radius:3px;flex-shrink:0}
/* Framework grid */
.framework{width:100%;border:1px solid #e5e5e5;border-radius:8px;overflow:hidden;font-size:10px}
.fw-level-row{display:grid;grid-template-columns:100px repeat(9,1fr);background:#3C3489}
.fw-level-hdr{padding:4px 2px;color:white;font-weight:600;text-align:center;border-right:1px solid rgba(255,255,255,0.2);font-size:10px}
.fw-level-hdr:last-child{border-right:none}
.fw-dim-row{display:grid;grid-template-columns:100px repeat(9,1fr);border-bottom:1px solid #e5e5e5}
.fw-dim-row:last-child{border-bottom:none}
.fw-row-label{padding:6px 8px;font-size:10px;font-weight:500;color:#555;background:#f9f9f9;border-right:1px solid #e5e5e5;display:flex;align-items:center;gap:5px;line-height:1.3}
.fw-cell{position:relative;border-right:1px solid #e5e5e5;min-height:44px;display:flex;align-items:center;justify-content:center}
.fw-cell:last-child{border-right:none}
.heat-bg{position:absolute;inset:0;pointer-events:none;transition:background 0.3s,opacity 0.3s}
.dot-wrap{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:2px;padding:3px;align-items:center;justify-content:center}
.org-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid white;flex-shrink:0;position:relative;cursor:default}
.org-dot:hover::after{content:attr(data-name);position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:white;font-size:9px;white-space:nowrap;padding:3px 6px;border-radius:4px;z-index:100;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:10px;color:#555}
.leg-dot{width:10px;height:10px;border-radius:50%;border:1.5px solid white;flex-shrink:0;box-shadow:0 0 0 1px #ccc}
.live-badge{display:flex;align-items:center;gap:5px;font-size:12px;color:#1D9E75;font-weight:500}
.live-dot{width:7px;height:7px;border-radius:50%;background:#1D9E75;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
.sm-btn{padding:6px 12px;font-size:12px;background:#fff;border:1px solid #d0d0d0;border-radius:7px;cursor:pointer;color:#555;display:inline-flex;align-items:center;gap:4px}
.sm-btn:hover{background:#f0f0f0}
/* Admin */
.admin-view{padding:1.5rem}
.dl-btn{padding:8px 16px;font-size:12px;font-weight:500;background:#534AB7;color:white;border:none;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.dl-btn:hover{background:#3C3489}
.admin-table{width:100%;font-size:11px;border-collapse:collapse;margin-top:1rem}
.admin-table th{text-align:left;padding:7px 8px;font-size:10px;font-weight:600;color:#666;border-bottom:1px solid #e5e5e5;background:#f9f9f9;white-space:nowrap}
.admin-table td{padding:7px 8px;border-bottom:1px solid #f0f0f0;vertical-align:middle}
.admin-table tr:hover td{background:#fafafa}
.admin-table tr.hidden-row td{opacity:0.4}
.del-btn{padding:2px 8px;font-size:10px;color:#D85A30;background:transparent;border:1px solid #D85A30;border-radius:4px;cursor:pointer}
.del-btn:hover{background:#FAECE7}
.toggle{position:relative;width:36px;height:20px;flex-shrink:0;display:inline-block}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:20px;cursor:pointer;transition:background 0.2s}
.toggle-slider:before{content:'';position:absolute;width:14px;height:14px;left:3px;top:3px;background:white;border-radius:50%;transition:transform 0.2s}
.toggle input:checked+.toggle-slider{background:#1D9E75}
.toggle input:checked+.toggle-slider:before{transform:translateX(16px)}
.pass-screen{max-width:300px;margin:3rem auto;text-align:center}
.pass-screen h3{font-size:16px;font-weight:500;margin-bottom:1rem}
.pass-screen input{margin-bottom:0.75rem}
.pass-screen button{width:100%;padding:9px;font-size:13px;font-weight:500;background:#534AB7;color:white;border:none;border-radius:8px;cursor:pointer}
.other-input{margin-top:6px;display:none}
.other-input.show{display:block}
.prov-tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;background:#EEEDFE;color:#3C3489;font-weight:500}
.workshop-badge{background:#534AB7;color:white;font-size:11px;font-weight:500;padding:4px 12px;border-radius:20px;display:inline-block;margin-bottom:1rem}
.empty-map{text-align:center;padding:2rem;color:#888;font-size:13px;margin-top:1rem;border:1px dashed #e5e5e5;border-radius:8px}
.pptx-dl-btn{padding:3px 9px;font-size:10px;font-weight:500;background:#534AB7;color:white;border:none;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pptx-dl-btn:hover{background:#3C3489}
.pptx-dl-btn:disabled{background:#aaa;cursor:not-allowed}
</style>
</head>
<body>
<div id="root"></div>
<script>
// ─── Constants ─────────────────────────────────────────────────────────────
const DIMS=[
  {id:'frl',    label:'Funding Readiness (FRL)',       short:'Funding',    color:'FAC775'},
  {id:'trl',    label:'Technology Readiness (TRL)',    short:'Tech / TRL', color:'97C459'},
  {id:'brl',    label:'Business Readiness (BRL)',      short:'Business',   color:'5DCAA5'},
  {id:'iprl',   label:'IP Readiness (IP-RL)',          short:'IP',         color:'AFA9EC'},
  {id:'mrl',    label:'Manufacturing Readiness (MRL)', short:'Mfg',        color:'85B7EB'},
  {id:'teamrl', label:'Team Readiness (TEAM-RL)',      short:'Team',       color:'F0997B'},
];
// ACRL_DIMS = all dims for the questionnaire (FRL first, TRL included as ACRL-style block)
const ACRL_DIMS=DIMS;
// Dimensions that can be "supported by funding" (everything except TRL and FRL itself)
const FRL_SUPPORT_DIMS=DIMS.filter(d=>d.id!=='frl'); // TRL now included as a supported dim

const TRL_DEFS={1:'New Principles Observed',2:'Concept Formulated',3:'Proof of Concept',4:'Component Validation (In Lab)',5:'Component Validation (In Relevant Environment)',6:'System Prototype (In Relevant Environment)',7:'System Prototype (In Operational Environment)',8:'System Qualified (In Operational Environment)',9:'System Deployed (In Operational Environment)'};
const ACRL_DEFS={
  frl:{1:'Institutional Support',2:'Discovery Funds',3:'Feasibility Funds',4:'Translational Funds',5:'Prototype Capital',6:'Validation Capital',7:'Pilot Capital',8:'Market Entry Capital',9:'Growth Capital'},
  trl:{1:'New Principles Observed',2:'Concept Formulated',3:'Proof of Concept',4:'Component Validation (In Lab)',5:'Component Validation (In Relevant Environment)',6:'System Prototype (In Relevant Environment)',7:'System Prototype (In Operational Environment)',8:'System Qualified (In Operational Environment)',9:'System Deployed (In Operational Environment)'},
  brl:{1:'Scientific Discovery',2:'Concept Application',3:'Desktop Research',4:'Primary Market Research',5:'Business Model Refinement [Messy Middle]',6:'Business Model Refinement [Messy Middle]',7:'Commercial and Product Validation',8:'Pilots',9:'Recurring Sales'},
  iprl:{1:'New Knowledge',2:'Utility Formulated',3:'Invention',4:'IP Strategy Determined',5:'Claims Drafted',6:'Provisional Patent',7:'Non-Provisional PCT',8:'Commercial Clearance',9:'Portfolio Defense'},
  mrl:{1:'Pre-Manufacturing',2:'Manufacturing Concept for Invention',3:'Ad-Hoc Fabrication',4:'Production Feasibility Assessed',5:'Pre-Production Process',6:'High-Fidelity Prototype Assembly',7:'Production Relevant Environment',8:'Low Rate Initial Production',9:'Full-Scale Production'},
  teamrl:{1:'Pure Academic Inquiry',2:'Research Unit',3:'Technical Execution',4:'Designated Commercial Lead',5:'Organizational Maturity & Readiness [Messy Middle]',6:'Organizational Maturity & Readiness [Messy Middle]',7:'Organizational Maturity & Readiness [Messy Middle]',8:'Executive Leadership Transition & Governance',9:'Executive Management'},
};
const ORG_TYPES=['Business Accelerator / Incubator (BAI)','Venture Capital (VC) Firm / Institutional Investor','Angel Network / Angel Investment Group','Technology Transfer / Commercialization Office (TTO)','Federal/Provincial Innovation Granting Agency or Program Administrator','Academic Research Lab / Post-Secondary Institute','Private Sector Corporation / Industry Stakeholder','Other'];
const PROVINCES_ALL=['AB','BC','MB','NB','NL','NS','ON','PE','QC','SK','NT','NU','YT','National (Federal)'];
const ROLES=['Executive Director / Director / Management','Program Manager / Coordinator','Principal Investigator (PI) / Faculty Researcher','Founder / SME Owner','Other'];
const AFFILIATIONS=['Post-Secondary Affiliated (University, College, or CÉGEP)','Hospital or Academic Health Science Centre Affiliated','Community-Based / Non-Profit Independent','Privately Owned / For-Profit Entity','Other'];
const FUNDING_SRCS=['Federal Government Granting Councils (e.g., ISED, Tri-Agency, NRC-IRAP)','Provincial/Territorial Government Funding','Municipal Government Funding','Philanthropic Foundation / Non-Profit Granting Body','Fee-for-service / Client Fees','Corporate Sponsorship / Private Donation','Investment Fund Management Fees / Equity Returns','Other'];
const OFFERINGS=['Infrastructure: Co-work, office, or dedicated desk space','Infrastructure: Wet lab, dry lab, maker space, or specialized equipment access','Human Capital: Business coaching, executive mentoring, or leadership development','Market Access: Trade and export support','Ecosystem Access: Networking events, matchmaking, and corporate introductions','Financial Capital: Direct funding, micro-grants, or facilitated investor matching','Compliance Support: Regulatory assistance (e.g., Health Canada, FDA)','IP: Education, patent/trademark strategies, and licensing support','Technical Asset Development: Prototyping, MVP testing, or engineering assistance','Other'];
const SECTORS=['Sector-Agnostic / General Tech','Industry Focused'];
const DOT_COLORS=['#534AB7','#1D9E75','#D85A30','#D4537E','#378ADD','#639922','#BA7517','#A32D2D','#0F6E56','#993C1D','#185FA5','#3B6D11','#7B4EA6','#C0782A'];
const ADMIN_PASS='L2M2026';
const API='/api';

// ─── State ─────────────────────────────────────────────────────────────────
let submissions=[];
let currentView='survey';
let submitted=false;
let lastSubmission=null;
let adminAuthed=false;
let liveTimer=null;
let hiddenIds=new Set();
let provFilter=new Set();     // empty = all provinces; non-empty = show only selected
let subFilter=new Set();      // empty = show all; non-empty = show only selected IDs
let orgFilter=new Set();      // empty = all orgs; non-empty = show only selected org names
let fundingViewActive=false;  // funding view toggle

// ─── API ───────────────────────────────────────────────────────────────────
async function loadSubs(){
  try{const r=await fetch(`${API}/submissions`);submissions=await r.json();}
  catch(e){submissions=[];}
}
async function saveSub(sub){
  const r=await fetch(`${API}/submissions`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(sub)});
  return (await r.json()).id;
}
async function deleteSub(id){
  hiddenIds.delete(id);
  await fetch(`${API}/submissions?id=${id}`,{method:'DELETE'});
  await loadSubs();render();
}
async function clearAll(){
  for(const s of submissions)await fetch(`${API}/submissions?id=${s.id}`,{method:'DELETE'});
  submissions=[];hiddenIds=new Set();provFilter=new Set();orgFilter=new Set();subFilter=new Set();render();
}

// ─── Visibility ─────────────────────────────────────────────────────────────
function visibleSubs(){
  return submissions.filter(s=>{
    if(hiddenIds.has(s.id))return false;
    // Province filter: submission must share at least one province with filter
    if(provFilter.size>0){
      const subProvs=s.provinces&&s.provinces.length>0?s.provinces:[s.province].filter(Boolean);
      if(!subProvs.some(p=>provFilter.has(p)))return false;
    }
    // Org filter: match on orgname
    if(orgFilter.size>0&&!orgFilter.has(s.orgname))return false;
    // Submission filter
    if(subFilter.size>0&&!subFilter.has(s.id))return false;
    return true;
  });
}
function toggleVisibility(id){
  if(hiddenIds.has(id))hiddenIds.delete(id);else hiddenIds.add(id);
  renderView();
}
function setAllVisible(v){
  if(v)hiddenIds=new Set();else submissions.forEach(s=>hiddenIds.add(s.id));
  renderView();
}
function toggleProvFilter(prov){
  if(provFilter.has(prov))provFilter.delete(prov);else provFilter.add(prov);
  renderView();
}
function clearProvFilter(){provFilter=new Set();renderView();}
function toggleOrgFilter(org){
  if(orgFilter.has(org))orgFilter.delete(org);else orgFilter.add(org);
  renderView();
}
function clearOrgFilter(){orgFilter=new Set();renderView();}
function toggleSubFilter(id){
  if(subFilter.has(id))subFilter.delete(id);else subFilter.add(id);
  renderView();
}
function clearSubFilter(){subFilter=new Set();renderView();}
function toggleFundingView(){fundingViewActive=!fundingViewActive;renderView();}

// ─── Form helpers ──────────────────────────────────────────────────────────
function makeCheckItem(name,value,label,isRadio){
  const t=isRadio?'radio':'checkbox';
  const sid=`ci_${name}_${value.replace(/\W/g,'_').substring(0,30)}`;
  const sv=value.replace(/'/g,"\\'");
  return `<div class="check-item" onclick="toggleCheck('${name}','${sv}',${isRadio})">
    <input type="${t}" name="${name}" value="${value}" id="${sid}">
    <label for="${sid}">${label}</label>
  </div>`;
}
function toggleCheck(name,value,isRadio){
  if(isRadio){document.querySelectorAll(`[name="${name}"]`).forEach(i=>{i.checked=false;i.closest('.check-item').classList.remove('sel');});}
  const t=document.querySelector(`[name="${name}"][value="${value}"]`);
  if(!t)return;
  t.checked=isRadio?true:!t.checked;
  t.closest('.check-item').classList.toggle('sel',t.checked);
  if(value==='Other'){const wrap=document.getElementById(`other_${name}`);if(wrap)wrap.classList.toggle('show',!!document.querySelector(`[name="${name}"][value="Other"]:checked`));}
}
function trlSelect(id,label){
  const opts=[1,2,3,4,5,6,7,8,9].map(i=>`<option value="${i}">TRL ${i} — ${TRL_DEFS[i]}</option>`).join('');
  return `<div><div class="lvl-label">${label}</div>
    <select id="${id}" onchange="showTrlDef('${id}')"><option value="">Select TRL level...</option>${opts}</select>
    <div class="trl-def" id="${id}_def"></div></div>`;
}
function showTrlDef(id){
  const sel=document.getElementById(id),def=document.getElementById(id+'_def');
  if(sel&&def){const v=parseInt(sel.value);if(v&&TRL_DEFS[v]){def.textContent=TRL_DEFS[v];def.classList.add('show');}else def.classList.remove('show');}
}
function acrlDimBlock(dim){
  const makeOpts=()=>Object.entries(ACRL_DEFS[dim.id]).map(([k,v])=>`<option value="${k}">${dim.short} Level ${k} — ${v}</option>`).join('');
  // For FRL: show frl_supports prompt when checked
  const extraOnClick=dim.id==='frl'?";updateFrlSupports()":"";
  return `<div class="acrl-section">
    <div class="acrl-dim-header" onclick="toggleAcrlDim('${dim.id}')">
      <input type="checkbox" id="acrl_cb_${dim.id}">
      <div class="acrl-dim-color" style="background:#${dim.color}"></div>
      <div class="acrl-dim-label">${dim.label}</div>
    </div>
    <div class="acrl-dim-body" id="acrl_body_${dim.id}">
      <div class="acrl-entry-exit">
        <div><div class="lvl-label">Minimum level for entry into program</div>

          <div class="trl-def" id="acrl_exit_${dim.id}_def"></div></div>
      </div>
      ${dim.id==='frl'?`
      <div class="frl-supports" id="frl_supports_wrap">
        <div class="frl-supports-label"><i class="ti ti-info-circle" style="font-size:12px;vertical-align:-1px"></i> Which other ACRL dimensions is this funding intended to support — but for which no additional direct resources are provided as part of the program?</div>

}
function toggleAcrlDim(id){

function updateFrlSupports(){

function showAcrlDef(dimId,type){
  const sel=document.getElementById(`acrl_${type}_${dimId}`),def=document.getElementById(`acrl_${type}_${dimId}_def`);
  if(sel&&def){const v=sel.value;const lbl=v!==''&&ACRL_DEFS[dimId]&&ACRL_DEFS[dimId][v];if(lbl){def.textContent=lbl;def.classList.add('show');}else def.classList.remove('show');}
}
function getChecked(name){return Array.from(document.querySelectorAll(`[name="${name}"]:checked`)).map(i=>i.value);}
function getRadio(name){const i=document.querySelector(`[name="${name}"]:checked`);return i?i.value:'';}
function getFrlSupports(){
  const sel=document.getElementById('frl_supports_select');

}

async function submitForm(){
  const orgname=document.getElementById('f_orgname')?.value?.trim();
  const progname=document.getElementById('f_progname')?.value?.trim();
  const provinces=getChecked('provinces');
  const role=getRadio('role'),orgtype=getRadio('orgtype'),intake=getRadio('intake'),structure=getRadio('structure');
  const err=document.getElementById('form_err');
  if(!orgname||!progname||provinces.length===0||!role||!orgtype||!intake||!structure){
    if(err)err.textContent='Please complete all required fields (marked with *) before submitting.';
    document.getElementById('form_err').scrollIntoView({behavior:'smooth',block:'center'});return;
  }
  if(err)err.textContent='';
  const btn=document.querySelector('.submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Submitting...';}
  const acrlData={};
  ACRL_DIMS.forEach(d=>{
    const cb=document.getElementById('acrl_cb_'+d.id);
    if(cb&&cb.checked){acrlData[d.id]={entry:document.getElementById(`acrl_entry_${d.id}`)?.value||'',exit:document.getElementById(`acrl_exit_${d.id}`)?.value||''};}
  });
  const frl_supports=acrlData.frl?getFrlSupports():[];
  // TRL now stored inside acrl object like other dims
  const trl_min=acrlData.trl?acrlData.trl.entry:'';
  const trl_exit=acrlData.trl?acrlData.trl.exit:'';
  const sub={
    orgname,progname,
    provinces,
    province:provinces[0]||'',
    role,orgtype,
    affiliations:getChecked('affil'),funding:getChecked('funding'),
    intake,structure,duration:document.getElementById('f_duration')?.value||'',
    offerings:getChecked('offerings'),sectors:getChecked('sectors'),
    trl_min,trl_exit,
    acrl:acrlData,frl_supports,
    selection:document.getElementById('f_selection')?.value?.trim()||'',
    missing:document.getElementById('f_missing')?.value?.trim()||'',
    kpis:document.getElementById('f_kpis')?.value?.trim()||''
  };
  await saveSub(sub);lastSubmission=sub;submitted=true;render();
}
function resetForm(){submitted=false;lastSubmission=null;render();}

async function downloadPptx(subData){
  const data=subData||lastSubmission;if(!data)return;
  const btn=document.getElementById(subData?`pptx_${subData.id}`:'pptx-btn');
  const status=document.getElementById('gen-status'),msg=document.getElementById('gen-msg');
  if(btn)btn.disabled=true;if(status)status.classList.add('show');if(msg)msg.textContent='Generating your presentation...';
  try{
    const resp=await fetch('/api/generate-pptx',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(!resp.ok)throw new Error('Server error');
    const blob=await resp.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=`${(data.orgname||'org').replace(/[^a-z0-9]/gi,'_')}_${(data.progname||'program').replace(/[^a-z0-9]/gi,'_')}_L2M.pptx`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    if(msg)msg.textContent='✓ Download started!';if(btn)btn.disabled=false;
    setTimeout(()=>{if(status)status.classList.remove('show');},3000);
  }catch(e){if(msg)msg.textContent='Generation failed — please try again.';if(btn)btn.disabled=false;}
}
function downloadPptxById(id){const sub=submissions.find(s=>s.id===id);if(sub)downloadPptx(sub);}

// ─── Map ───────────────────────────────────────────────────────────────────
function renderMap(){
  const allVisible=visibleSubs();
  const totalSubs=submissions.length;
  const hiddenCount=totalSubs-allVisible.length;
  const allProvs=[...new Set(submissions.flatMap(s=>s.provinces&&s.provinces.length>0?s.provinces:[s.province||'']).filter(Boolean))].sort();
  const allOrgs=[...new Set(submissions.map(s=>s.orgname).filter(Boolean))].sort();

  // Funding view: only submissions that selected FRL
  const fundingSubs=allVisible.filter(s=>s.acrl&&s.acrl.frl);
  const displaySubs=fundingViewActive?fundingSubs:allVisible;

  const trlSubs=displaySubs.filter(s=>s.trl_min||s.trl_exit);
  const acrlSubs=displaySubs.filter(s=>s.acrl&&Object.keys(s.acrl).length>0);

  // Heat calculation — only from displaySubs
  const maxHeat=Math.max(1,...DIMS.map(dim=>{
    if(dim.id==='trl')return Math.max(...[1,2,3,4,5,6,7,8,9].map(lv=>displaySubs.filter(s=>s.trl_min&&s.trl_exit&&parseInt(s.trl_min)<=lv&&parseInt(s.trl_exit)>=lv).length));
    return Math.max(...[1,2,3,4,5,6,7,8,9].map(lv=>displaySubs.filter(s=>s.acrl&&s.acrl[dim.id]&&parseInt(s.acrl[dim.id].entry||0)<=lv&&parseInt(s.acrl[dim.id].exit||9)>=lv).length));
  }));

  function dotColor(s){const idx=submissions.indexOf(s);return DOT_COLORS[idx%DOT_COLORS.length];}

  // For funding view: build cell renderers
  function renderCell(dim, lv){
    if(!fundingViewActive){
      // Standard view
      let orgs;
      if(dim.id==='trl') orgs=displaySubs.filter(s=>s.trl_min&&s.trl_exit&&parseInt(s.trl_min)<=lv&&parseInt(s.trl_exit)>=lv);
      else orgs=displaySubs.filter(s=>s.acrl&&s.acrl[dim.id]&&parseInt(s.acrl[dim.id].entry||0)<=lv&&parseInt(s.acrl[dim.id].exit||9)>=lv);
      const alpha=orgs.length>0?Math.min(0.85,0.18+(orgs.length/maxHeat)*0.67):0;
      const dots=orgs.slice(0,6).map(s=>`<div class="org-dot" style="background:${dotColor(s)}" data-name="${s.orgname}${s.progname?' — '+s.progname:''}"></div>`).join('');
      const extra=orgs.length>6?`<div style="font-size:8px;color:#666">+${orgs.length-6}</div>`:'';
      return `<div class="fw-cell"><div class="heat-bg" style="background:#${dim.color};opacity:${alpha}"></div><div class="dot-wrap">${dots}${extra}</div></div>`;
    }

    // Funding view
    if(dim.id==='frl'){
      // Solid: funders operating at this FRL level
      const solidOrgs=displaySubs.filter(s=>s.acrl&&s.acrl.frl&&parseInt(s.acrl.frl.entry||0)<=lv&&parseInt(s.acrl.frl.exit||9)>=lv);
      const alpha=solidOrgs.length>0?Math.min(0.85,0.18+(solidOrgs.length/Math.max(1,fundingSubs.length))*0.67):0;
      const dots=solidOrgs.slice(0,6).map(s=>`<div class="org-dot" style="background:${dotColor(s)}" data-name="${s.orgname}${s.progname?' — '+s.progname:''}"></div>`).join('');
      const extra=solidOrgs.length>6?`<div style="font-size:8px;color:#666">+${solidOrgs.length-6}</div>`:'';
      return `<div class="fw-cell"><div class="heat-bg" style="background:#${dim.color};opacity:${alpha}"></div><div class="dot-wrap">${dots}${extra}</div></div>`;
    } else {
      // Solid: funders who have this dim selected with direct resources AND their FRL range covers this level
      const solidOrgs=displaySubs.filter(s=>{
        if(!s.acrl||!s.acrl.frl||!s.acrl[dim.id])return false;
        // Must not be in frl_supports (frl_supports = no direct resources)
        if(s.frl_supports&&s.frl_supports.includes(dim.id))return false;
        const frlEntry=parseInt(s.acrl.frl.entry||0);
        const frlExit=parseInt(s.acrl.frl.exit||9);
        const dimEntry=parseInt(s.acrl[dim.id].entry||0);
        const dimExit=parseInt(s.acrl[dim.id].exit||9);
        return frlEntry<=lv&&frlExit>=lv&&dimEntry<=lv&&dimExit>=lv;
      });
      // Faded: funders who marked this dim as supported but no direct resources, FRL range covers this level
      const fadedOrgs=displaySubs.filter(s=>{
        if(!s.acrl||!s.acrl.frl)return false;
        if(!(s.frl_supports&&s.frl_supports.includes(dim.id)))return false;
        const frlEntry=parseInt(s.acrl.frl.entry||0);
        const frlExit=parseInt(s.acrl.frl.exit||9);
        return frlEntry<=lv&&frlExit>=lv;
      });
      const solidAlpha=solidOrgs.length>0?Math.min(0.85,0.18+(solidOrgs.length/Math.max(1,fundingSubs.length))*0.67):0;
      const fadedAlpha=fadedOrgs.length>0&&solidOrgs.length===0?0.18:0;
      const alpha=solidAlpha||fadedAlpha;
      const allDots=[
        ...solidOrgs.slice(0,6).map(s=>`<div class="org-dot" style="background:${dotColor(s)}" data-name="${s.orgname}${s.progname?' — '+s.progname:''}"></div>`),
        ...fadedOrgs.slice(0,Math.max(0,6-solidOrgs.length)).map(s=>`<div class="org-dot" style="background:${dotColor(s)};opacity:0.4" data-name="${s.orgname} (supports ${dim.short}, no direct resources)"></div>`)
      ];
      const extra=(solidOrgs.length+fadedOrgs.length)>6?`<div style="font-size:8px;color:#666">+${(solidOrgs.length+fadedOrgs.length)-6}</div>`:'';
      return `<div class="fw-cell"><div class="heat-bg" style="background:#${dim.color};opacity:${alpha}"></div><div class="dot-wrap">${allDots.join('')}${extra}</div></div>`;
    }
  }

  // Which dims to show in funding view (hide TRL row, show FRL + supported dims)
  const dimsToShow=DIMS; // All dims shown in both views

  return `<div class="map-container">
    <div class="map-toolbar">
      <div style="font-size:15px;font-weight:600">Innovation Ecosystem — Live Map</div>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="live-badge"><div class="live-dot"></div>Live</div>
        <button class="sm-btn" onclick="loadSubs().then(renderView)"><i class="ti ti-refresh" style="font-size:13px"></i> Refresh</button>
      </div>
    </div>

    <div class="view-mode-bar ${fundingViewActive?'funding-mode':''}">
      <div class="view-mode-label">${fundingViewActive?'<i class="ti ti-coin" style="font-size:13px;vertical-align:-2px"></i> <strong>Funding view</strong> — FRL submissions only. <strong>Dark</strong> = direct funding + resources provided. <strong>Light</strong> = funding intends to support but no additional resources provided.':'<i class="ti ti-layout-grid" style="font-size:13px;vertical-align:-2px"></i> <strong>Standard view</strong> — showing all submissions across all dimensions.'}</div>
      <button class="pill-btn ${fundingViewActive?'funding-active':''}" onclick="toggleFundingView()">
        ${fundingViewActive?'Exit funding view':'Switch to funding view'}
      </button>
    </div>

    ${allProvs.length>0?`<div class="filter-bar">
      <span class="filter-label"><i class="ti ti-map-pin" style="font-size:12px;vertical-align:-1px"></i> Province:</span>
      <button class="pill-btn ${provFilter.size===0?'active':''}" onclick="clearProvFilter()">All</button>
      ${allProvs.map(p=>`<button class="pill-btn ${provFilter.has(p)?'active':''}" onclick="toggleProvFilter('${p}')">${p}</button>`).join('')}
      <div class="filter-divider"></div>
      <span class="filter-count">Showing <strong>${displaySubs.length}</strong> of <strong>${totalSubs}</strong>${hiddenCount>0?` (${hiddenCount} hidden)`:''}</span>
    </div>`:''}

    ${allOrgs.length>0?`<div class="filter-bar" style="flex-wrap:wrap;gap:6px">
      <span class="filter-label"><i class="ti ti-building" style="font-size:12px;vertical-align:-1px"></i> Organization:</span>
      <button class="pill-btn ${orgFilter.size===0?'active':''}" onclick="clearOrgFilter()">All</button>
      ${allOrgs.map(org=>`<button class="pill-btn ${orgFilter.has(org)?'active':''}" onclick="toggleOrgFilter('${org.replace(/'/g,"\\'")}')">${org}</button>`).join('')}
    </div>`:''}

    ${allVisible.length>0?`<div class="filter-bar" style="flex-wrap:wrap;gap:6px">
      <span class="filter-label"><i class="ti ti-layout-grid" style="font-size:12px;vertical-align:-1px"></i> Program:</span>
      <button class="pill-btn ${subFilter.size===0?'active':''}" onclick="clearSubFilter()">All</button>
      ${allVisible.map(s=>`<button class="pill-btn ${subFilter.has(s.id)?'active':''}" onclick="toggleSubFilter('${s.id.replace(/'/g,"\\'")}')" title="${s.orgname}">${s.progname||s.orgname}</button>`).join('')}
    </div>`:''}

    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">${fundingViewActive?'Funding orgs':'Organizations'}</div><div class="stat-val">${displaySubs.length}</div></div>
      <div class="stat-card"><div class="stat-label">Provinces</div><div class="stat-val">${[...new Set(displaySubs.map(s=>s.province))].length}</div></div>
      <div class="stat-card"><div class="stat-label">With TRL data</div><div class="stat-val">${trlSubs.length}</div></div>
      <div class="stat-card"><div class="stat-label">ACRL responses</div><div class="stat-val">${acrlSubs.length}</div></div>
    </div>

    <div class="framework">
      <div class="fw-level-row">
        <div class="fw-level-hdr" style="text-align:left;padding-left:8px;font-size:9px">Level →</div>
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<div class="fw-level-hdr">${n}</div>`).join('')}
      </div>
      ${dimsToShow.map(dim=>`<div class="fw-dim-row">
        <div class="fw-row-label">
          <span style="width:9px;height:9px;border-radius:50%;background:#${dim.color};display:inline-block;flex-shrink:0"></span>
          ${dim.short}
        </div>
        ${[1,2,3,4,5,6,7,8,9].map(lv=>renderCell(dim,lv)).join('')}
      </div>`).join('')}
    </div>

    <div class="legend">
      <span style="font-size:10px;font-weight:600;color:#666;margin-right:4px">Programs:</span>
      ${displaySubs.slice(0,14).map(s=>`<div class="leg-item"><div class="leg-dot" style="background:${dotColor(s)}"></div><span>${s.progname||s.orgname}</span></div>`).join('')}
      ${displaySubs.length>14?`<span style="font-size:10px;color:#888">+${displaySubs.length-14} more</span>`:''}
    </div>
    ${displaySubs.length===0?`<div class="empty-map">${totalSubs>0?(fundingViewActive?'No funding organizations in current view.':'No submissions match the current filters.'):'No submissions yet.'}</div>`:''}
  </div>`;
}

// ─── Admin ─────────────────────────────────────────────────────────────────
function renderAdmin(){
  if(!adminAuthed){
    return `<div class="admin-view"><div class="pass-screen">
      <h3>Admin access</h3>
      <input type="password" id="pass_input" placeholder="Enter password" onkeydown="if(event.key==='Enter')checkPass()">
      <div id="pass_err" style="color:#D85A30;font-size:11px;margin-bottom:8px;min-height:16px"></div>
      <button onclick="checkPass()">Unlock</button>
      <p style="font-size:11px;color:#888;margin-top:1rem">Default password: L2M2026</p>
    </div></div>`;
  }
  const shownCount=submissions.filter(s=>!hiddenIds.has(s.id)).length;
  return `<div class="admin-view">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;flex-wrap:wrap;gap:8px">
      <div style="font-size:15px;font-weight:600">All submissions <span style="font-size:13px;font-weight:400;color:#666">(${submissions.length} total · ${shownCount} shown on map)</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="sm-btn" onclick="loadSubs().then(renderView)"><i class="ti ti-refresh" style="font-size:12px"></i> Refresh</button>
        <button class="sm-btn" onclick="setAllVisible(true)"><i class="ti ti-eye" style="font-size:12px"></i> Show all</button>
        <button class="sm-btn" onclick="setAllVisible(false)"><i class="ti ti-eye-off" style="font-size:12px"></i> Hide all</button>
        <button class="dl-btn" onclick="downloadCSV()"><i class="ti ti-download" style="font-size:13px"></i> CSV</button>
        <button class="dl-btn" style="background:#D85A30" onclick="if(confirm('Clear ALL submissions?'))clearAll()">Clear all</button>
      </div>
    </div>
    <div style="font-size:11px;color:#666;margin-bottom:0.75rem;background:#F5F5F5;padding:8px 12px;border-radius:6px;border:1px solid #E5E5E5">
      Use the <strong>toggle</strong> on each row to show or hide that submission on the live map.
    </div>
    ${submissions.length===0?`<div class="empty-map">No submissions yet.</div>`:`
    <div style="overflow-x:auto"><table class="admin-table">
      <thead><tr><th>Map</th><th>#</th><th>Organization</th><th>Program</th><th>Province</th><th>TRL</th><th>ACRL dims</th><th>FRL supports</th><th>Time</th><th>Slides</th><th></th></tr></thead>
      <tbody>
      ${submissions.map((s,i)=>{
        const isVisible=!hiddenIds.has(s.id);
        const safeId=s.id.replace(/'/g,"\\'");
        return `<tr class="${isVisible?'':'hidden-row'}">
          <td><label class="toggle"><input type="checkbox" ${isVisible?'checked':''} onchange="toggleVisibility('${safeId}')"><span class="toggle-slider"></span></label></td>
          <td style="color:#888">${i+1}</td>
          <td style="font-weight:500;max-width:100px">${s.orgname||'—'}</td>
          <td style="font-size:11px;max-width:100px;color:#444">${s.progname||'—'}</td>
          <td>${(s.provinces&&s.provinces.length>0?s.provinces:[s.province||'']).filter(Boolean).map(p=>`<span class="prov-tag" style="margin-right:2px">${p}</span>`).join('')||'—'}</td>
          <td style="font-size:11px;white-space:nowrap">${s.trl_min?`${s.trl_min}→${s.trl_exit||'?'}`:'—'}</td>
          <td style="font-size:10px">${Object.keys(s.acrl||{}).map(id=>DIMS.find(d=>d.id===id)?.short||id).join(', ')||'—'}</td>
          <td style="font-size:10px;color:#888">${(s.frl_supports||[]).map(id=>DIMS.find(d=>d.id===id)?.short||id).join(', ')||'—'}</td>
          <td style="font-size:10px;color:#888;white-space:nowrap">${s.ts?new Date(s.ts).toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}</td>
          <td><button class="pptx-dl-btn" id="pptx_${s.id}" onclick="downloadPptxById('${safeId}')"><i class="ti ti-download" style="font-size:10px"></i> .pptx</button></td>
          <td><button class="del-btn" onclick="if(confirm('Delete this entry?'))deleteSub('${safeId}')">Del</button></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table></div>`}
  </div>`;
}

function checkPass(){
  const v=document.getElementById('pass_input')?.value;
  if(v===ADMIN_PASS){adminAuthed=true;render();}
  else{const e=document.getElementById('pass_err');if(e)e.textContent='Incorrect password.';}
}

function downloadCSV(){
  const headers=['ID','Org Name','Program Name','Province','Role','Org Type','Affiliations','Funding Sources','Intake','Structure','Duration','Offerings','Sectors','TRL Entry','TRL Exit','ACRL Dimensions','ACRL Entry/Exit Detail','FRL Supports (no direct resources)','Selection Criteria','Missing Framework','KPIs','Submitted At','Shown on Map'];
  const rows=submissions.map(s=>[
    `"${s.id}"`,`"${(s.orgname||'').replace(/"/g,"'")}"`,`"${(s.progname||'').replace(/"/g,"'")}"`,
    `"${(s.provinces&&s.provinces.length>0?s.provinces:[s.province||'']).filter(Boolean).join('; ')}"`,`"${s.role||''}"`,`"${s.orgtype||''}"`,
    `"${(s.affiliations||[]).join('; ')}"`,`"${(s.funding||[]).join('; ')}"`,
    s.intake||'',s.structure||'',s.duration||'',
    `"${(s.offerings||[]).join('; ')}"`,`"${(s.sectors||[]).join('; ')}"`,
    s.trl_min||'',s.trl_exit||'',
    `"${Object.keys(s.acrl||{}).join('; ')}"`,
    `"${Object.entries(s.acrl||{}).map(([k,v])=>`${k}: ${v.entry||'?'}→${v.exit||'?'}`).join('; ')}"`,
    `"${(s.frl_supports||[]).map(id=>DIMS.find(d=>d.id===id)?.label||id).join('; ')}"`,
    `"${(s.selection||'').replace(/"/g,"'")}"`,`"${(s.missing||'').replace(/"/g,"'")}"`,
    `"${(s.kpis||'').replace(/"/g,"'")}"`,`"${s.ts||''}"`,
    hiddenIds.has(s.id)?'No':'Yes'
  ]);
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;
  a.download='acrl_ecosystem_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

// ─── Nav & render ──────────────────────────────────────────────────────────
function renderNav(){
  return `<div class="nav">
    <button class="nav-btn ${currentView==='survey'?'active':''}" onclick="switchView('survey')">Questionnaire</button>
    <button class="nav-btn ${currentView==='map'?'active':''}" onclick="switchView('map')">Live Map</button>
    <button class="nav-btn ${currentView==='admin'?'active':''}" onclick="switchView('admin')">Admin</button>
  </div>`;
}
function switchView(v){currentView=v;if(v==='map'||v==='admin')loadSubs().then(renderView);else render();}
function renderView(){
  const root=document.getElementById('root');
  let body='';
  if(currentView==='survey')body=renderSurvey();
  else if(currentView==='map')body=renderMap();
  else body=renderAdmin();
  root.innerHTML=renderNav()+body;
}
function render(){renderView();}
if(liveTimer)clearInterval(liveTimer);
liveTimer=setInterval(()=>{if(currentView==='map')loadSubs().then(renderView);},8000);
render();
</script>
</body>
</html>
